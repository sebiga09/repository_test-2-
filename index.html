<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>번개 반응속도 테스트 ⚡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #1e1e38 0%, #0f1026 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: #1f223d;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 24px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #2e335b;
      position: relative;
      overflow: hidden;
    }

    /* 상단 장식 뱃지 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #ffd700;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: -0.2px;
    }

    /* 1. 게임 제목 */
    .title {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(110, 86, 248, 0.4);
    }

    .title span {
      background: linear-gradient(90deg, #ff6b8b, #ff8e53);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 2. 간단한 설명 */
    .subtitle {
      font-size: 14px;
      color: #a5a9d6;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.4;
      font-weight: 500;
    }

    /* 4. 게임 진행 영역 (터치 박스) */
    .game-screen {
      width: 100%;
      height: 260px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border: 3px solid transparent;
      margin-bottom: 18px;
    }

    /* 상태별 테마 */
    /* 대기 전 안내 상태 (READY) */
    .state-idle {
      background: linear-gradient(145deg, #2b3054, #212543);
      border-color: #3f4777;
      color: #e2e4ff;
    }

    /* 준비 중 (주황/빨강 - 누르면 안 됨!) */
    .state-waiting {
      background: linear-gradient(145deg, #ff4757, #d63031);
      border-color: #ff6b81;
      color: #ffffff;
      animation: pulse-danger 1.5s infinite;
    }

    /* 초록색 (지금 클릭!) */
    .state-now {
      background: linear-gradient(145deg, #2ed573, #10ac84);
      border-color: #7bed9f;
      color: #ffffff;
      animation: pulse-active 0.8s infinite alternate;
    }

    /* 실패 (부정출발) */
    .state-fail {
      background: linear-gradient(145deg, #ffa502, #e67e22);
      border-color: #ffd32a;
      color: #ffffff;
    }

    /* 결과 성공 화면 */
    .state-success {
      background: linear-gradient(145deg, #3742fa, #2f3542);
      border-color: #70a1ff;
      color: #ffffff;
    }

    @keyframes pulse-danger {
      0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
      70% { box-shadow: 0 0 0 16px rgba(255, 71, 87, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    @keyframes pulse-active {
      0% { transform: scale(0.99); box-shadow: 0 0 20px rgba(46, 213, 115, 0.6); }
      100% { transform: scale(1.02); box-shadow: 0 0 35px rgba(46, 213, 115, 0.9); }
    }

    .game-icon {
      font-size: 50px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .game-prompt {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.3px;
    }

    .game-hint {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 8px;
      font-weight: 500;
    }

    /* 5. 점수 및 결과 메시지 표시 영역 */
    .dashboard-panel {
      width: 100%;
      background: #181a30;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 18px;
      border: 1px solid #282c52;
    }

    .dash-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dash-label {
      font-size: 12px;
      color: #8b92c4;
      font-weight: 600;
    }

    .dash-val {
      font-size: 24px;
      font-weight: 900;
      color: #2ed573;
      font-variant-numeric: tabular-nums;
    }

    .dash-val.best {
      color: #ffd32a;
    }

    .dash-unit {
      font-size: 12px;
      font-weight: normal;
      color: #8b92c4;
      margin-left: 2px;
    }

    /* 6. 성공 / 실패 평가 칭호 및 피드백 메시지 */
    .feedback-banner {
      width: 100%;
      min-height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      color: #f1f2f6;
      margin-bottom: 20px;
      border: 1px dashed #3a3f68;
    }

    /* 버튼 공통 스타일 (큼직하고 둥글게) */
    .btn-action {
      width: 100%;
      height: 60px;
      border-radius: 999px;
      border: none;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    /* 3. 시작 버튼 */
    .btn-start {
      background: linear-gradient(90deg, #6c5ce7, #a55eea);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.45);
    }

    .btn-start:hover {
      background: linear-gradient(90deg, #5b4bc4, #944ed8);
    }

    /* 7. 다시 시작 버튼 */
    .btn-restart {
      background: linear-gradient(90deg, #ff4757, #ff6b81);
      box-shadow: 0 8px 24px rgba(255, 71, 87, 0.4);
    }

    .btn-restart:hover {
      background: linear-gradient(90deg, #e03b4a, #f7556c);
    }

    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* 가이드 팝업 텍스트 */
    .level-guide {
      font-size: 11px;
      color: #7b81b3;
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 상단 태그 -->
    <div class="badge">🎮 미니게임 챌린지</div>

    <!-- 1. 게임 제목 -->
    <h1 class="title">⚡ <span>반응속도</span> 테스트</h1>

    <!-- 2. 간단한 설명 -->
    <p class="subtitle">
      화면이 <strong style="color: #2ed573;">초록색</strong>으로 바뀌면<br>
      최대한 빠르게 화면을 터치하세요!
    </p>

    <!-- 4. 게임 진행 영역 -->
    <div id="gameScreen" class="game-screen state-idle">
      <div id="gameIcon" class="game-icon">👆</div>
      <div id="gamePrompt" class="game-prompt">시작 버튼을 눌러줘!</div>
      <div id="gameHint" class="game-hint">아래 '게임 시작' 버튼 클릭</div>
    </div>

    <!-- 5. 점수 표시 대시보드 -->
    <div class="dashboard-panel">
      <div class="dash-item">
        <span class="dash-label">이번 기록</span>
        <div class="dash-val"><span id="currentScore">0</span><span class="dash-unit">ms</span></div>
      </div>
      <div style="width: 1px; height: 32px; background: #282c52;"></div>
      <div class="dash-item">
        <span class="dash-label">최고 기록 👑</span>
        <div class="dash-val best"><span id="bestScore">-</span><span class="dash-unit">ms</span></div>
      </div>
    </div>

    <!-- 6. 성공/실패 피드백 메시지 바 -->
    <div id="feedbackBanner" class="feedback-banner">
      준비되면 시작 버튼을 눌러서 도전해봐! 🎯
    </div>

    <!-- 3. 시작 버튼 & 7. 다시 시작 버튼 -->
    <button id="mainBtn" class="btn-action btn-start">
      <span>🚀 게임 시작!</span>
    </button>

    <div class="level-guide">
      ⚡ 200ms 이하: 프로게이머급 | 200~270ms: 빠른 반응 | 350ms+: 멍때리기 금지!
    </div>
  </div>

  <script>
    // 상태 정의
    // 'IDLE': 대기 전
    // 'WAITING': 시작됨, 빨간색 배경, 초록색 기다리는 중
    // 'READY_TO_CLICK': 초록색 켜짐, 터치해야 하는 타이밍
    // 'RESULT': 결과 도출 (성공 or 실패)
    let gameState = 'IDLE';

    let timerTimeout = null;
    let startTime = 0;
    let bestScoreValue = null;

    // DOM 요소 캐싱
    const gameScreen = document.getElementById('gameScreen');
    const gameIcon = document.getElementById('gameIcon');
    const gamePrompt = document.getElementById('gamePrompt');
    const gameHint = document.getElementById('gameHint');
    const currentScoreEl = document.getElementById('currentScore');
    const bestScoreEl = document.getElementById('bestScore');
    const feedbackBanner = document.getElementById('feedbackBanner');
    const mainBtn = document.getElementById('mainBtn');

    // UI 상태 업데이트 함수
    function setIdleState() {
      gameState = 'IDLE';
      clearTimeout(timerTimeout);

      gameScreen.className = 'game-screen state-idle';
      gameIcon.textContent = '👆';
      gamePrompt.textContent = '준비 완료!';
      gameHint.textContent = "아래 '게임 시작' 버튼을 누르면 시작돼";

      feedbackBanner.innerHTML = '빨간불 땐 참아야 해! 초록불에 바로 터치! 🔥';

      mainBtn.className = 'btn-action btn-start';
      mainBtn.innerHTML = '<span>🚀 게임 시작!</span>';
      mainBtn.disabled = false;
    }

    function setWaitingState() {
      gameState = 'WAITING';

      // 빨간색 대기 화면
      gameScreen.className = 'game-screen state-waiting';
      gameIcon.textContent = '🛑';
      gamePrompt.textContent = '기다려... 아직 누르지 마!';
      gameHint.textContent = '초록색으로 바뀌는 순간 터치해야 해!';

      feedbackBanner.innerHTML = '집중해! 언제 바뀔지 몰라... ⏳';

      // 진행 중일 때는 하단 버튼 비활성화 (화면 터치 유도)
      mainBtn.disabled = true;
      mainBtn.innerHTML = '<span>집중하는 중...👀</span>';

      // 1.8초 ~ 4.5초 사이 무작위 지연시간 후 초록색으로 변경
      const randomDelay = Math.floor(Math.random() * 2700) + 1800;

      timerTimeout = setTimeout(() => {
        setGreenState();
      }, randomDelay);
    }

    function setGreenState() {
      gameState = 'READY_TO_CLICK';
      startTime = Date.now();

      gameScreen.className = 'game-screen state-now';
      gameIcon.textContent = '⚡';
      gamePrompt.textContent = '지금 바로 탭(클릭)!!';
      gameHint.textContent = '최대한 빠르게 터치해!';
    }

    function setFailState() {
      // 너무 일찍 눌렀을 때 (실패)
      gameState = 'RESULT';
      clearTimeout(timerTimeout);

      gameScreen.className = 'game-screen state-fail';
      gameIcon.textContent = '🚨';
      gamePrompt.textContent = '너무 빨랐어! (부정출발)';
      gameHint.textContent = '초록색이 되기 전에 누르면 안 돼!';

      feedbackBanner.innerHTML = '❌ <strong>실패!</strong> 마음이 너무 급했어, 다시 해볼까?';

      // 다시 시작 버튼으로 전환
      setRestartButton();
    }

    function setSuccessState(scoreMs) {
      gameState = 'RESULT';

      gameScreen.className = 'game-screen state-success';
      gameIcon.textContent = '🎉';
      gamePrompt.textContent = `${scoreMs} ms!`;
      gameHint.textContent = '훌륭한 반응속도야!';

      currentScoreEl.textContent = scoreMs;

      // 최고기록 갱신 판별
      if (bestScoreValue === null || scoreMs < bestScoreValue) {
        bestScoreValue = scoreMs;
        bestScoreEl.textContent = bestScoreValue;
      }

      // 6. 점수대별 맞춤 성공 메시지
      let evaluation = '';
      if (scoreMs <= 180) {
        evaluation = '🏆 <strong>대박!</strong> 프로게이머급 신의 반응속도!';
      } else if (scoreMs <= 240) {
        evaluation = '⚡ <strong>빛의 속도!</strong> 피지컬이 아주 뛰어나!';
      } else if (scoreMs <= 300) {
        evaluation = '👍 <strong>나이스!</strong> 평균보다 빠른 편이야!';
      } else if (scoreMs <= 400) {
        evaluation = '🙂 <strong>양호!</strong> 다음엔 200ms대에 도전해봐!';
      } else {
        evaluation = '🐢 <strong>앗, 살짝 멍때렸나?</strong> 한 번 더 집중해보자!';
      }

      feedbackBanner.innerHTML = evaluation;

      // 다시 시작 버튼으로 전환
      setRestartButton();
    }

    function setRestartButton() {
      mainBtn.disabled = false;
      mainBtn.className = 'btn-action btn-restart';
      mainBtn.innerHTML = '<span>🔄 다시 시작</span>';
    }

    // 메인 시작/재시작 버튼 이벤트 핸들러
    mainBtn.addEventListener('click', () => {
      if (gameState === 'IDLE' || gameState === 'RESULT') {
        setWaitingState();
      }
    });

    // 화면 영역 터치/클릭 이벤트 핸들러
    function handleScreenTap(e) {
      e.preventDefault(); // 더블탭 줌 등 모바일 제스처 방지

      if (gameState === 'WAITING') {
        // 초록불 전에 눌렀을 경우: 실패
        setFailState();
      } else if (gameState === 'READY_TO_CLICK') {
        // 성공 타이밍
        const endTime = Date.now();
        const reactionTime = endTime - startTime;
        setSuccessState(reactionTime);
      } else if (gameState === 'IDLE') {
        // 대기 화면을 터치해도 바로 게임 시작 가능하도록 배려
        setWaitingState();
      }
    }

    // 터치 및 마우스 클릭 이벤트 바인딩
    gameScreen.addEventListener('mousedown', handleScreenTap);
    gameScreen.addEventListener('touchstart', handleScreenTap, { passive: false });

    // 초기 상태 실행
    setIdleState();
  </script>
</body>
</html>
